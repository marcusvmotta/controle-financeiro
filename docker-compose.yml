# Sobe o sistema inteiro: docker compose up --build
# App em http://localhost:8080 · Swagger em http://localhost:8080/swagger
#
# Valores sensíveis vêm do arquivo .env (copie de .env.example).
# Sem .env, os padrões abaixo (após ":-") permitem rodar localmente mesmo assim.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_dev}
    ports:
      - "5432:5432" # exposto para o modo "dev com hot reload" (API rodando fora do Docker)
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=finance;Username=finance;Password=${POSTGRES_PASSWORD:-finance_dev}
      Swagger__Enabled: "true"
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:-local-docker-key-NOT-for-production-0123456789}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
