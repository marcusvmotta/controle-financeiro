# Headers de segurança (TRD 04-seguranca), incluídos em cada "location".
# Motivo: um location que define o próprio add_header NÃO herda os add_header do bloco server.
# A Content-Security-Policy entra no M5, depois de testada com o Angular Material.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
